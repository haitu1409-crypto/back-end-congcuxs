services:
  - type: web
    name: dande-api
    env: node
    buildCommand: npm ci --only=production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
    scaling:
      minInstances: 1
      maxInstances: 3
    disk:
      name: dande-disk
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: dande-mongodb
    databaseName: dande
    user: dande_user